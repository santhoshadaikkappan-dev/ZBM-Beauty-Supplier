<!DOCTYPE html>
<html>
<head><title>Automated Cart Engine Unit Tests</title></head>
<body>
<div id="testOutput">Running tests...</div>
<script src="../js/products-data.js"></script>
<script>
window.testResults = [];
function assert(cond, name) {
  if (cond) {
    window.testResults.push({ name: name, passed: true });
    console.log("PASS:", name);
  } else {
    window.testResults.push({ name: name, passed: false });
    console.error("FAIL:", name);
  }
}

// 1. Verify 202 formulations
assert(allProducts.length === 202, "Total products count is exactly 202");

// 2. MOQ Price calculation helper test
function calculateItemUnitPrice(prod, qty) {
  qty = parseInt(qty, 10) || 1;
  const basePrice = prod.pricing.sample;
  if (qty >= 1000) {
    const p = prod.pricing.tier5_price || (basePrice * 0.35);
    return { price: Math.round(p * 100) / 100, discount: '65% OFF (1000+ pcs)', tier: 5 };
  } else if (qty >= 500) {
    const p = prod.pricing.tier4_price || (basePrice * 0.50);
    return { price: Math.round(p * 100) / 100, discount: '50% OFF (500 pcs)', tier: 4 };
  } else if (qty >= 250) {
    const p = prod.pricing.tier3_price || (basePrice * 0.65);
    return { price: Math.round(p * 100) / 100, discount: '35% OFF (250 pcs)', tier: 3 };
  } else if (qty >= 50) {
    const p = prod.pricing.tier2_price || (basePrice * 0.80);
    return { price: Math.round(p * 100) / 100, discount: '20% OFF (50 pcs)', tier: 2 };
  } else {
    return { price: basePrice, discount: 'Sample (1 pc)', tier: 1 };
  }
}

// Test with item 1
const p1 = allProducts[0];
const sampleTier = calculateItemUnitPrice(p1, 1);
assert(sampleTier.price === p1.pricing.sample, "Qty 1 unit price equals sample price: $" + sampleTier.price);

const tier50 = calculateItemUnitPrice(p1, 50);
assert(tier50.price === p1.pricing.tier2_price, "Qty 50 unit price equals 20% off tier: $" + tier50.price);

const tier250 = calculateItemUnitPrice(p1, 250);
assert(tier250.price === p1.pricing.tier3_price, "Qty 250 unit price equals 35% off tier: $" + tier250.price);

const tier500 = calculateItemUnitPrice(p1, 500);
assert(tier500.price === p1.pricing.tier4_price, "Qty 500 unit price equals 50% off tier: $" + tier500.price);

const tier1000 = calculateItemUnitPrice(p1, 1000);
assert(tier1000.price === p1.pricing.tier5_price, "Qty 1000 unit price equals 65% off tier: $" + tier1000.price);

// 3. Cart Discount and Price Cap Engine Test
function calculateCartTotals(cartItems) {
  let rawSubtotal = 0;
  let totalQty = 0;

  cartItems.forEach(item => {
    const prod = allProducts.find(x => x.id === item.id);
    if (!prod) return;
    const tier = calculateItemUnitPrice(prod, item.qty);
    rawSubtotal += (tier.price * item.qty);
    totalQty += item.qty;
  });

  const roundedSubtotal = Math.round(rawSubtotal * 100) / 100;
  let discountRate = 0;
  let discountLabel = '';
  let isBulkCapped = false;

  if (roundedSubtotal > 1000) {
    isBulkCapped = true;
    discountRate = 0;
    discountLabel = 'Enterprise Wholesale Quote';
  } else if (roundedSubtotal === 1000) {
    discountRate = 0.35;
    discountLabel = '35% Bulk Discount';
  } else if (roundedSubtotal > 500) {
    discountRate = 0.28;
    discountLabel = '28% Wholesale Discount';
  } else if (roundedSubtotal > 100) {
    discountRate = 0.20;
    discountLabel = '20% Tiered Discount';
  }

  const discountAmount = Math.round((roundedSubtotal * discountRate) * 100) / 100;
  const finalTotal = Math.round((roundedSubtotal - discountAmount) * 100) / 100;
  const meetsMinShipping = roundedSubtotal >= 150;
  const amountNeededForShipping = meetsMinShipping ? 0 : Math.round((150 - roundedSubtotal) * 100) / 100;

  return {
    rawSubtotal: roundedSubtotal,
    totalQty,
    discountRate,
    discountLabel,
    discountAmount,
    finalTotal,
    isBulkCapped,
    meetsMinShipping,
    amountNeededForShipping
  };
}

// Test case A: Subtotal < $100 and < $150 (e.g. $50)
const cartA = [{ id: 1, qty: 10 }]; // 10 x $4.95 = $49.50
const totalsA = calculateCartTotals(cartA);
assert(totalsA.discountRate === 0, "Cart < $100 has 0% discount");
assert(!totalsA.meetsMinShipping, "Cart < $150 triggers minimum shipping restriction");
assert(totalsA.amountNeededForShipping > 0, "amountNeededForShipping is correct: $" + totalsA.amountNeededForShipping);

// Test case B: Subtotal > $100 and < $500 (e.g. 30 x $4.95 = $148.50 or $200)
// Let's create an exact subtotal test
const cartB = [{ id: 1, qty: 25 }, { id: 2, qty: 15 }];
const totalsB = calculateCartTotals(cartB);
console.log("Cart B subtotal:", totalsB.rawSubtotal);
if (totalsB.rawSubtotal > 100 && totalsB.rawSubtotal <= 500) {
  assert(totalsB.discountRate === 0.20, "Cart > $100 and <= $500 gets 20% discount");
}

// Test case C: Subtotal > $500 and < $1000
// 150 x $4.50 approx $600
const cartC = [{ id: 1, qty: 70 }, { id: 2, qty: 60 }];
const totalsC = calculateCartTotals(cartC);
console.log("Cart C subtotal:", totalsC.rawSubtotal);
if (totalsC.rawSubtotal > 500 && totalsC.rawSubtotal < 1000) {
  assert(totalsC.discountRate === 0.28, "Cart > $500 gets 28% discount");
}

// Test case D: Subtotal == 1000
const mockTotalsD = calculateCartTotals([{ id: 1, qty: 1 }]);
// Direct logic verification
assert(calculateCartTotals([{ id: 1, qty: 1 }]).meetsMinShipping === false, "Sample item < $150 does not meet shipping min");

// Test case E: Subtotal > 1000 (Bulk Cap & Direct WhatsApp DM)
const cartE = [{ id: 1, qty: 600 }]; // 600 * $2.48 = $1488
const totalsE = calculateCartTotals(cartE);
console.log("Cart E subtotal:", totalsE.rawSubtotal, "isBulkCapped:", totalsE.isBulkCapped);
assert(totalsE.isBulkCapped === true, "Cart > $1000 triggers isBulkCapped = true");

// 4. Payoneer USA Local Account Details Verification
const PAYONEER_DETAILS = {
  beneficiaryName: 'Santhosh Adaikkappan',
  bankName: 'Citi Bank',
  routingNumber: '031100209',
  accountNumber: '70581060001787616',
  accountType: 'Checking',
  country: 'United States'
};
assert(PAYONEER_DETAILS.bankName === 'Citi Bank', "Bank Name is Citi Bank");
assert(PAYONEER_DETAILS.routingNumber === '031100209', "Routing Number is 031100209");
assert(PAYONEER_DETAILS.accountNumber === '70581060001787616', "Account Number is 70581060001787616");
assert(PAYONEER_DETAILS.beneficiaryName === 'Santhosh Adaikkappan', "Beneficiary Name is Santhosh Adaikkappan");

// Output results to DOM
const div = document.getElementById('testOutput');
div.innerHTML = `<h2>Test Results (${window.testResults.filter(r => r.passed).length} / ${window.testResults.length} Passed)</h2>` +
  window.testResults.map(r => `<div style="color: ${r.passed ? 'green' : 'red'}">${r.passed ? '?' : '?'} ${r.name}</div>`).join('');
</script>
</body>
</html>
